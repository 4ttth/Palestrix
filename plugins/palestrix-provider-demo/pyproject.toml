[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palestrix-provider-demo"
version = "1.0.0"
description = "PalestrIX reference plugin: an instant echo instance provider. The provider-authoring tutorial and the plugin contract test fixture."
requires-python = ">=3.11"

[project.entry-points."palestrix.plugins"]
provider-demo = "palestrix_provider_demo.plugin:ProviderDemoPlugin"

[tool.setuptools.packages.find]
include = ["palestrix_provider_demo*"]

[tool.setuptools.package-data]
palestrix_provider_demo = ["plugin.toml"]
