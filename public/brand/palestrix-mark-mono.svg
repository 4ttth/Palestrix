<!-- PalestrIX "The Keystone", single colour. Inherits currentColor when inlined;
     use for embroidery, laser etching, foil, one-colour print and fax-grade output.
     The channel carries the meaning, so the mark survives with no second colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="currentColor" role="img" aria-label="PalestrIX">
  <path d="M28 4H4v56h56V36H48v12H16V16h12z"/>
  <rect x="36" y="4" width="24" height="24"/>
</svg>
